<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopiology Café</title>
    <link rel="stylesheet" href="css/style-products.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lora:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Our Products</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html" class="active">Products</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    
    <main>
        <!-- Categories Section -->
        <section class="categories">
            <div class="category" data-category="popular" onclick="filterCategory('popular')">Popular</div>

            <div class="category" data-category="noncoffee" onclick="filterCategory('noncoffee')">Non-Coffee</div>

            <div class="category" data-category="ricenoodle" onclick="filterCategory('ricenoodle')">Rice & Noodle</div>
        </section>

        <!-- Menu Display Section -->
        <section class="menu-section">
            <h2 id="menu-title">Popular</h2>
            <div class="menu-items" id="menu-items">
                <!-- Menu items will be dynamically added here by JavaScript -->
            </div>
        </section>
    </main>
